# Global properties
# Colours are Burning Sun (dotfiles/theme/schemes/). The bar reads in grey;
# ember appears only for a critical value or unread mail.
command=~/.scripts/i3blocks/i3blocks-contrib/$BLOCK_NAME/$BLOCK_NAME
separator=true
separator_block_width=20

[window]
color=#ede8e0
command=while true; do xprop -id $(xprop -root _NET_ACTIVE_WINDOW | cut -d ' ' -f 5) WM_NAME | cut -d '"' -f 2; sleep 0.05; done
interval=persist

