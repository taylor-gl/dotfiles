#[protonvpn]
#command=sudo ~/.scripts/i3blocks/protonvpn-block/protonvpn
#interval=1

[cpu_usage]
label=CPU 
T_WARN=70
T_CRIT=90
DECIMALS=0
interval=10
COLOR_NORMAL=#8a8479
COLOR_WARN=#e8724a
COLOR_CRIT=#ff4a00

[temperature]
label=CPU TEMP 
interval=10
T_WARN=70
T_CRIT=90
#SENSOR_CHIP=""

[gpu-load]
label=GPU 
command=~/.scripts/i3blocks/i3blocks-contrib/$BLOCK_NAME/$BLOCK_NAME
GPU_BRAND=NVIDIA
T_WARN=70
T_CRIT=90
interval=10

[memory]
command=~/.scripts/i3blocks/i3blocks-contrib/$BLOCK_NAME/$BLOCK_NAME | head -n 1 | cut -d " " -f 1
label=RAM 
interval=10

[disk]
LABEL=DISK 
ALERT_LOW=10
interval=10

[weather]
command=python3 ~/.scripts/i3blocks/i3blocks-weather/weather.py -c Toronto -s
markup=pango
interval=3600

[date]
command=date '+%A %d %B %I:%M %p'; [[ -z "${BLOCK_BUTTON}" ]] || ~/.scripts/i3blocks/rofi_calendar.sh
separator=false
interval=5

[battery]
command=~/.scripts/i3blocks/i3blocks-contrib/$BLOCK_NAME/$BLOCK_NAME
interval=30
LABEL=   
#LABEL=⚡
#BAT_NUMBER=0

# Unread Proton mail, via Proton Mail Bridge on 127.0.0.1:1143. Silent when
# there is nothing unread, or when credentials are not set in ~/.secrets.
# Click opens the mail client.
[email]
command=~/.scripts/i3blocks-email.py
interval=120
markup=pango
separator=false

# Current Burning Sun variant; click to flip the whole desktop. Refreshed on
# SIGRTMIN+10, which the switch scripts send, so a change driven by cron shows
# up here immediately rather than at the next poll. The interval is only a
# self-heal in case a signal is ever missed.
[theme]
command=~/.scripts/i3blocks-theme.sh
interval=60
signal=10
markup=pango
separator=false

[spacer]
command=echo
interval=once
separator=false
