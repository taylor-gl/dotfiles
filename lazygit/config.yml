gui:
  # BEGIN burning-sun (generated by theme/build.sh)
  theme:
    activeBorderColor:
      - "#ff4a00"
      - bold
    inactiveBorderColor:
      - "#262626"
    searchingActiveBorderColor:
      - "#ff4a00"
      - bold
    optionsTextColor:
      - "#8a8479"
    selectedLineBgColor:
      - "#262626"
    inactiveViewSelectedLineBgColor:
      - "#141312"
    cherryPickedCommitFgColor:
      - "#0a0a0a"
    cherryPickedCommitBgColor:
      - "#ff4a00"
    markedBaseCommitFgColor:
      - "#0a0a0a"
    markedBaseCommitBgColor:
      - "#e8724a"
    unstagedChangesColor:
      - "#ff4a00"
    defaultFgColor:
      - "#ede8e0"
  # END burning-sun
  nerdFontsVersion: '3'
  filterMode: 'fuzzy'
update:
  method: never
promptToReturnFromSubprocess: false
keybinding:
  universal:
    prevItem-alt: 'e'
    nextItem-alt: 'n'
    scrollLeft: 'H'
    scrollRight: 'I'
    prevBlock-alt: 'e'
    nextBlock-alt: 'n'
    new: 'k'
    edit: 'f'
    editHunk: 'F'
    nextMatch: 'k'
    prevMatch: 'K'
    openFile: '<c-f>'
    scrollUpMain-alt1: 'E'
    scrollDownMain-alt1: 'N'
    undo: 'l'
    redo: 'L'
  files:
    ignoreFile: 'I'
  commits:
    moveDownCommit: '<c-n>'
    moveUpCommit: '<c-e>'
  branches:
    viewGitFlowOptions: 'I'
  submodules:
    init: 'I'


# S-e opens in editor still for some reason
