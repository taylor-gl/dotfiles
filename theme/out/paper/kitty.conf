# Burning Sun Paper — generated by theme/build.sh, do not edit
#
# Written against the scheme's `extras.ansi` block rather than the stock
# base16 kitty template. Stock would map color1 (red) to base08 and color2
# (green) to base0B, which in this scheme means `git diff` comes out as ember
# against grey — unreadable. The ansi block is the carve-out where hue is
# allowed to survive, desaturated far enough to sit under the rubrication.

background            #ede8e0
foreground            #0a0a0a
selection_background  #cfc7b9
selection_foreground  #0a0a0a

cursor                #ff4a00
cursor_text_color     #ede8e0

url_color             #6b665e

# Window and tab chrome: black on black, separated by the ember only where
# focus needs to be unambiguous.
active_border_color   #ff4a00
inactive_border_color #cfc7b9
bell_border_color     #ff4a00

active_tab_background   #ede8e0
active_tab_foreground   #ff4a00
inactive_tab_background #e3ddd3
inactive_tab_foreground #6b665e
tab_bar_background      #e3ddd3

mark1_foreground #ede8e0
mark1_background #ff4a00
mark2_foreground #ede8e0
mark2_background #c93a08
mark3_foreground #ede8e0
mark3_background #6b665e

# ANSI 0-15
color0  #cfc7b9
color1  #ff4a00
color2  #4d4a44
color3  #c93a08
color4  #ff4a00
color5  #6b665e
color6  #55504a
color7  #55504a
color8  #9a9184
color9  #ff4a00
color10 #0a0a0a
color11 #c93a08
color12 #ff4a00
color13 #55504a
color14 #4d4a44
color15 #0a0a0a
