# Burning Sun Dark — generated by theme/build.sh, do not edit
#
# Written against the scheme's `extras.ansi` block rather than the stock
# base16 kitty template. Stock would map color1 (red) to base08 and color2
# (green) to base0B, which in this scheme means `git diff` comes out as ember
# against grey — unreadable. The ansi block is the carve-out where hue is
# allowed to survive, desaturated far enough to sit under the rubrication.

background            #0a0a0a
foreground            #ede8e0
selection_background  #262626
selection_foreground  #ede8e0

cursor                #ff4a00
cursor_text_color     #0a0a0a

url_color             #8a8479

# Window and tab chrome: black on black, separated by the ember only where
# focus needs to be unambiguous.
active_border_color   #ff4a00
inactive_border_color #262626
bell_border_color     #ff4a00

active_tab_background   #0a0a0a
active_tab_foreground   #ff4a00
inactive_tab_background #141312
inactive_tab_foreground #8a8479
tab_bar_background      #141312

mark1_foreground #0a0a0a
mark1_background #ff4a00
mark2_foreground #0a0a0a
mark2_background #e8724a
mark3_foreground #0a0a0a
mark3_background #8a8479

# ANSI 0-15
color0  #262626
color1  #ff4a00
color2  #c4bfb6
color3  #e8724a
color4  #ff4a00
color5  #8a8479
color6  #a8a196
color7  #a8a196
color8  #5f5a52
color9  #ff4a00
color10 #ede8e0
color11 #e8724a
color12 #ff4a00
